# Pakker addonet og lægger det op på CurseForge (projekt 1760154).
#
# Sådan udløses den:
#   - Når "## Version:" i WastedCoast/WastedCoast.toc ændres og lander på main.
#     Workflowet laver så et tag (fx v0.26.2) og starter en manuel kørsel af sig selv,
#     som pakker og uploader den version. Er versionen allerede udgivet (tagget findes),
#     sker der ingenting.
#   - Manuelt fra fanen Actions ("Run workflow"), fx hvis en upload fejlede.
#     Findes tagget allerede, pakkes og uploades den version igen.
#
# Hvorfor to kørsler: BigWigs-packageren pakker aldrig ved et push til en branch, hvis
# HEAD har et tag ("Found future tag ..., not packaging"). Den regner med, at tag-pushet
# starter sin egen kørsel, men tags pushet med GITHUB_TOKEN starter ikke workflows.
# En workflow_dispatch-kørsel bliver ikke sprunget over, så push-kørslen starter én.
#
# Kræver repo-secret CF_API_KEY (CurseForge API-token).
name: Release til CurseForge

on:
  push:
    branches: [main]
    paths:
      - "WastedCoast/WastedCoast.toc"
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # push-kørslen starter upload-kørslen (gh workflow run)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Læs version fra .toc
        id: version
        run: |
          version=$(grep -m1 -i '^## Version:' WastedCoast/WastedCoast.toc | sed 's/^## [Vv]ersion:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ -z "$version" ]; then echo "Fandt ingen ## Version i .toc"; exit 1; fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag er allerede udgivet, springer over."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Ny version: $tag"
          fi

      - name: Lav og push tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Wasted Coast Forever ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Ved push: lad en manuel kørsel pakke og uploade (se øverst). Den finder tagget og
      # går videre til "Brug det eksisterende tag".
      - name: Start upload-kørslen
        if: steps.version.outputs.exists == 'false' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "Upload af ${{ steps.version.outputs.tag }} kører nu som en manuel kørsel under Actions."

      - name: Brug det eksisterende tag (manuel genkørsel)
        if: steps.version.outputs.exists == 'true' && github.event_name == 'workflow_dispatch'
        run: git checkout "${{ steps.version.outputs.tag }}"

      - name: Lav release-noter for den nye version
        if: github.event_name == 'workflow_dispatch'
        run: |
          .github/scripts/changelog.sh > CHANGELOG-release.md
          cat CHANGELOG-release.md

      - name: Pak og upload til CurseForge
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          # Filnavn og visningsnavn på CurseForge: WastedCoastForever-v0.30.0 osv.
          args: -p 1760154 -n "WastedCoastForever-{project-version}:WastedCoastForever-{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Gem zip som artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WastedCoastForever-${{ steps.version.outputs.tag }}
          path: .release/*.zip
